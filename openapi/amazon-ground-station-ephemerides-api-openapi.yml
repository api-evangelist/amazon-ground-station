security:
- hmac: []
tags:
- name: Ephemerides
paths:
  /ephemerides:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ListEphemerides
      description: List existing ephemerides.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEphemeridesResponse'
              examples:
                ListEphemerides200Example:
                  summary: Default ListEphemerides 200 response
                  x-microcks-default: true
                  value:
                    contactId: abc-123
                    contactStatus: COMPLETED
        '480':
          description: InvalidParameterException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterException'
              examples:
                ListEphemerides480Example:
                  summary: Default ListEphemerides 480 response
                  x-microcks-default: true
                  value:
                    contactId: abc-123
                    contactStatus: COMPLETED
        '481':
          description: DependencyException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyException'
              examples:
                ListEphemerides481Example:
                  summary: Default ListEphemerides 481 response
                  x-microcks-default: true
                  value:
                    contactId: abc-123
                    contactStatus: COMPLETED
        '482':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
              examples:
                ListEphemerides482Example:
                  summary: Default ListEphemerides 482 response
                  x-microcks-default: true
                  value:
                    contactId: abc-123
                    contactStatus: COMPLETED
      parameters:
      - name: maxResults
        in: query
        required: false
        description: Maximum number of ephemerides to return.
        schema:
          type: integer
          minimum: 0
          maximum: 100
      - name: nextToken
        in: query
        required: false
        description: Pagination token.
        schema:
          type: string
          pattern: ^[A-Za-z0-9-/+_.=]+$
          minLength: 3
          maxLength: 1000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - endTime
              - satelliteId
              - startTime
              properties:
                endTime:
                  description: The end time to list in UTC. The operation will return an ephemeris if its expiration time is within the time range defined by the <code>startTime</code> and <code>endTime</code>.
                  type: string
                  format: date-time
                satelliteId:
                  description: The AWS Ground Station satellite ID to list ephemeris for.
                  type: string
                  pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$
                  minLength: 1
                  maxLength: 128
                startTime:
                  description: The start time to list in UTC. The operation will return an ephemeris if its expiration time is within the time range defined by the <code>startTime</code> and <code>endTime</code>.
                  type: string
                  format: date-time
                statusList:
                  description: The list of ephemeris status to return.
                  type: array
                  items:
                    $ref: '#/components/schemas/EphemerisStatus'
                  minItems: 0
                  maxItems: 500
      summary: Amazon Ground Station List Ephemerides
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Ephemerides
components:
  schemas:
    PaginationToken:
      type: string
      pattern: ^[A-Za-z0-9-/+_.=]+$
      minLength: 3
      maxLength: 1000
    EphemerisStatus:
      type: string
      enum:
      - VALIDATING
      - INVALID
      - ERROR
      - ENABLED
      - DISABLED
      - EXPIRED
    ListEphemeridesResponse:
      type: object
      properties:
        ephemerides:
          allOf:
          - $ref: '#/components/schemas/EphemeridesList'
          - description: List of ephemerides.
        nextToken:
          allOf:
          - $ref: '#/components/schemas/PaginationToken'
          - description: Pagination token.
    Timestamp:
      type: string
      format: date-time
    EphemerisItem:
      type: object
      properties:
        creationTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The time the ephemeris was uploaded in UTC.
        enabled:
          allOf:
          - $ref: '#/components/schemas/Boolean'
          - description: Whether or not the ephemeris is enabled.
        ephemerisId:
          allOf:
          - $ref: '#/components/schemas/Uuid'
          - description: The AWS Ground Station ephemeris ID.
        name:
          allOf:
          - $ref: '#/components/schemas/SafeName'
          - description: A name string associated with the ephemeris. Used as a human-readable identifier for the ephemeris.
        priority:
          allOf:
          - $ref: '#/components/schemas/EphemerisPriority'
          - description: <p>Customer-provided priority score to establish the order in which overlapping ephemerides should be used.</p> <p>The default for customer-provided ephemeris priority is 1, and higher numbers take precedence.</p> <p>Priority must be 1 or greater</p>
        sourceS3Object:
          allOf:
          - $ref: '#/components/schemas/S3Object'
          - description: Source S3 object used for the ephemeris.
        status:
          allOf:
          - $ref: '#/components/schemas/EphemerisStatus'
          - description: The status of the ephemeris.
      description: Ephemeris item.
    S3VersionId:
      type: string
      pattern: ^[\s\S]{1,1024}$
      minLength: 1
      maxLength: 1024
    DependencyException: {}
    S3Object:
      type: object
      properties:
        bucket:
          allOf:
          - $ref: '#/components/schemas/S3BucketName'
          - description: An Amazon S3 Bucket name.
        key:
          allOf:
          - $ref: '#/components/schemas/S3ObjectKey'
          - description: An Amazon S3 key for the ephemeris.
        version:
          allOf:
          - $ref: '#/components/schemas/S3VersionId'
          - description: For versioned S3 objects, the version to use for the ephemeris.
      description: Object stored in S3 containing ephemeris data.
    S3BucketName:
      type: string
      pattern: ^[a-z0-9.-]{3,63}$
      minLength: 3
      maxLength: 63
    ResourceNotFoundException: {}
    SafeName:
      type: string
      pattern: ^[ a-zA-Z0-9_:-]{1,256}$
      minLength: 1
      maxLength: 256
    Boolean:
      type: boolean
    EphemerisPriority:
      type: integer
      minimum: 0
      maximum: 99999
    Uuid:
      type: string
      pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$
      minLength: 1
      maxLength: 128
    EphemeridesList:
      type: array
      items:
        $ref: '#/components/schemas/EphemerisItem'
      minItems: 1
      maxItems: 500
    InvalidParameterException: {}
    S3ObjectKey:
      type: string
      pattern: ^[a-zA-Z0-9!*'\)\(./_-]{1,1024}$
      minLength: 1
      maxLength: 1024
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/groundstation/
x-hasEquivalentPaths: true
