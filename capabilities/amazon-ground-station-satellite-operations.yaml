naftiko: 1.0.0-alpha2
info:
  label: Amazon Ground Station Satellite Operations
  description: Workflow capability for satellite operators and mission control teams using Amazon Ground Station. Covers contact
    scheduling, mission profile management, satellite tracking, and dataflow configuration for satellite operations.
  tags:
  - Amazon Ground Station
  - Satellite Operations
  - Mission Control
  - Space Technology
  - AWS
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
    AWS_REGION: AWS_REGION
capability:
  consumes:
  - type: http
    namespace: amazon-ground-station
    baseUri: https://groundstation.amazonaws.com
    description: Amazon Ground Station API
    authentication:
      type: bearer
      token: '{{AWS_AUTH_HEADER}}'
    resources:
    - name: contacts
      path: /contacts
      description: Satellite contact management
      operations:
      - name: ListContacts
        method: GET
        description: List all satellite contacts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: ReserveContact
        method: POST
        description: Schedule a satellite contact
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: CancelContact
        method: DELETE
        description: Cancel a scheduled contact
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: DescribeContact
        method: GET
        description: Get contact details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: mission-profiles
      path: /missionprofile
      description: Mission profile management
      operations:
      - name: ListMissionProfiles
        method: GET
        description: List all mission profiles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: CreateMissionProfile
        method: POST
        description: Create a mission profile
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: satellites
      path: /satellite
      description: Satellite tracking information
      operations:
      - name: ListSatellites
        method: GET
        description: List trackable satellites
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: ground-stations
      path: /groundstation
      description: Ground station location management
      operations:
      - name: ListGroundStations
        method: GET
        description: List all ground stations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8084
    namespace: ground-station-ops-api
    description: Unified REST API for Amazon Ground Station satellite operations.
    resources:
    - path: /v1/contacts
      name: contacts
      description: Satellite contact scheduling
      operations:
      - method: GET
        name: list-contacts
        description: List all satellite contacts
        call: amazon-ground-station.ListContacts
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: reserve-contact
        description: Schedule a satellite contact
        call: amazon-ground-station.ReserveContact
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/satellites
      name: satellites
      description: Satellite tracking information
      operations:
      - method: GET
        name: list-satellites
        description: List trackable satellites
        call: amazon-ground-station.ListSatellites
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/ground-stations
      name: ground-stations
      description: Ground station locations
      operations:
      - method: GET
        name: list-ground-stations
        description: List available ground stations
        call: amazon-ground-station.ListGroundStations
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/mission-profiles
      name: mission-profiles
      description: Satellite mission profiles
      operations:
      - method: GET
        name: list-mission-profiles
        description: List all mission profiles
        call: amazon-ground-station.ListMissionProfiles
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-mission-profile
        description: Create a new mission profile
        call: amazon-ground-station.CreateMissionProfile
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9094
    namespace: ground-station-ops-mcp
    transport: http
    description: MCP server for AI-assisted Amazon Ground Station satellite operations.
    tools:
    - name: list-satellite-contacts
      description: List all scheduled and historical satellite contacts with status and timing
      hints:
        readOnly: true
        openWorld: true
      call: amazon-ground-station.ListContacts
      outputParameters:
      - type: object
        mapping: $.
    - name: reserve-satellite-contact
      description: Schedule a new satellite contact window at an AWS ground station
      hints:
        readOnly: false
      call: amazon-ground-station.ReserveContact
      outputParameters:
      - type: object
        mapping: $.
    - name: cancel-satellite-contact
      description: Cancel a previously scheduled satellite contact
      hints:
        readOnly: false
        destructive: true
      call: amazon-ground-station.CancelContact
      outputParameters:
      - type: object
        mapping: $.
    - name: describe-contact
      description: Get detailed information about a specific satellite contact
      hints:
        readOnly: true
      call: amazon-ground-station.DescribeContact
      outputParameters:
      - type: object
        mapping: $.
    - name: list-trackable-satellites
      description: List all satellites that can be tracked through AWS Ground Station
      hints:
        readOnly: true
      call: amazon-ground-station.ListSatellites
      outputParameters:
      - type: object
        mapping: $.
    - name: list-ground-station-locations
      description: List all available AWS Ground Station antenna locations worldwide
      hints:
        readOnly: true
      call: amazon-ground-station.ListGroundStations
      outputParameters:
      - type: object
        mapping: $.
    - name: list-mission-profiles
      description: List all configured satellite mission profiles
      hints:
        readOnly: true
      call: amazon-ground-station.ListMissionProfiles
      outputParameters:
      - type: object
        mapping: $.
    - name: create-mission-profile
      description: Create a new mission profile defining satellite operations parameters
      hints:
        readOnly: false
      call: amazon-ground-station.CreateMissionProfile
      outputParameters:
      - type: object
        mapping: $.
    - name: list-configs
      description: List all dataflow endpoint and antenna configurations
      hints:
        readOnly: true
      call: amazon-ground-station.ListConfigs
      outputParameters:
      - type: object
        mapping: $.
    - name: create-dataflow-endpoint-group
      description: Create a dataflow endpoint group for satellite data delivery
      hints:
        readOnly: false
      call: amazon-ground-station.CreateDataflowEndpointGroup
      outputParameters:
      - type: object
        mapping: $.
